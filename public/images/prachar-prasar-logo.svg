<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="ppGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C62828"/>
      <stop offset="50%" stop-color="#9A1D1D"/>
      <stop offset="100%" stop-color="#4A0E0E"/>
    </linearGradient>
    <linearGradient id="ppGrad2" x1="20%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="40%" stop-color="#C62828"/>
      <stop offset="100%" stop-color="#7F1414"/>
    </linearGradient>
    <linearGradient id="ppGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D0606" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#C62828" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF5252" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark (Badge with Waves) -->
  <g transform="translate(10, 15)">
    <!-- Base Rounded Square -->
    <rect x="0" y="0" width="90" height="90" rx="14" fill="url(#ppGrad1)"/>
    
    <!-- Curved Wave Layer 1 -->
    <path d="M 0,35 Q 35,55 55,90 L 0,90 Z" fill="url(#ppGrad3)"/>
    
    <!-- Curved Wave Layer 2 (Swoosh) -->
    <path d="M 12,12 Q 30,50 82,75 Q 88,40 88,12 Z" fill="url(#ppGrad2)" opacity="0.85"/>
    <path d="M 10,90 Q 30,50 90,45 L 90,90 Z" fill="#5E0F0F" opacity="0.6"/>
    
    <!-- Inner Accent Wave -->
    <path d="M 22,12 Q 42,48 88,62 L 88,20 Q 55,16 22,12 Z" fill="#EF5350" opacity="0.3"/>
  </g>

  <!-- Wordmark "Prachar Prasar" -->
  <g transform="translate(125, 80)" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5">
    <!-- Prachar in Crimson Red -->
    <text x="0" y="0" fill="#C62828">Prachar</text>
    <!-- Prasar in Solid Black -->
    <text x="250" y="0" fill="#111111">Prasar</text>
  </g>
</svg>
